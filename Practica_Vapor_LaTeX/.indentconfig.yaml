# =============================================================================
# Configuración de latexindent para proyecto de vapor
# =============================================================================
# Este archivo configura el comportamiento de latexindent (formateador de LaTeX)
# para redirigir archivos de backup (.bak) al directorio build/
# =============================================================================

# Sangría por defecto (usar tabulaciones)
defaultIndent: "\t"

# Extensión de archivos de backup
backupExtension: .bak

# Directorio para archivos temporales y backups (cruft = basura)
# Esto evita que los .bak0, .bak1, etc. se generen en el directorio principal
cruftDirectory: build/

# Configuración de logs
logFilePreferences:
    # No mostrar cada archivo YAML leído (reduce verbosidad)
    showEveryYamlRead: 0
    # Directorio para logs
    logFile: build/indent.log

# Crear backups antes de modificar archivos
onlyOneBackUp: 0
maxNumberOfBackUps: 3

# Configuraciones de indentación específicas para LaTeX
indentRules:
    # Indentar entornos
    environments: 1
    # Indentar items de listas
    items: 1
    # Indentar comandos
    commands: 1

# Configuración de espacios en blanco
removeTrailingWhitespace:
    beforeProcessing: 0
    afterProcessing: 1

# Extensiones de archivos a procesar
fileExtensionPreference:
    - .tex
    - .sty
    - .cls
